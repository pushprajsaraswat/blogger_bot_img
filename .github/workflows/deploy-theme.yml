name: Deploy Blogger Theme

on:
  push:
    branches: [main]
    paths:
      - 'blogger_theme.xml'
      - '.github/workflows/deploy-theme.yml'
  workflow_dispatch:

jobs:
  deploy-theme:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Playwright
        run: npm init -y && npm install @playwright/test && npx playwright install --with-deps chromium

      - name: Deploy theme via Blogger dashboard
        env:
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          THEME_XML_PATH: ./blogger_theme.xml
        run: npx playwright test --project=chromium
