name: Import artwork from image URL

on:
  workflow_dispatch:
    inputs:
      image_url:
        description: "HTTPS URL of the image file (must be reachable by GitHub Actions)"
        required: true
        type: string
      post_folder:
        description: "Repository-relative post folder, e.g. blogger/2115571732997751588_post_2115571732997751588"
        required: true
        default: "blogger/2115571732997751588_post_2115571732997751588"
        type: string
      category:
        description: "Artwork category"
        required: true
        type: choice
        options:
          - featured
          - inline
          - character
          - scene
          - promotional
      filename:
        description: "Image filename including extension"
        required: true
        default: "featured.jpg"
        type: string

permissions:
  contents: write

concurrency:
  group: artwork-import-${{ github.workflow }}-${{ inputs.post_folder }}
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install image validator
        run: python -m pip install --disable-pip-version-check Pillow

      - name: Download and validate image
        env:
          IMAGE_URL: ${{ inputs.image_url }}
          POST_FOLDER: ${{ inputs.post_folder }}
          CATEGORY: ${{ inputs.category }}
          FILENAME: ${{ inputs.filename }}
        run: |
          python - <<'PY'
          import os, re, sys, hashlib
          from pathlib import Path
          from urllib.parse import urlparse
          from urllib.request import Request, urlopen
          from PIL import Image

          url = os.environ["IMAGE_URL"].strip()
          post = os.environ["POST_FOLDER"].strip().strip("/")
          category = os.environ["CATEGORY"].strip()
          filename = os.environ["FILENAME"].strip()

          parsed = urlparse(url)
          if parsed.scheme != "https" or not parsed.hostname:
              sys.exit("Rejected: image_url must be an HTTPS URL.")
          if not re.fullmatch(r"(blogger|telegram)/[A-Za-z0-9_.-]+", post):
              sys.exit("Rejected: post_folder must be a valid platform/post folder.")
          if category not in {"featured", "inline", "character", "scene", "promotional"}:
              sys.exit("Rejected: unsupported category.")
          if not re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9_.-]{0,100}\.(jpg|jpeg|png|webp)", filename, re.I):
              sys.exit("Rejected: filename must end in .jpg, .jpeg, .png, or .webp.")

          request_path = Path(post) / "request.json"
          if not request_path.is_file():
              sys.exit(f"Rejected: {request_path} does not exist.")
          import json
          request_data = json.loads(request_path.read_text(encoding="utf-8"))
          required = request_data.get("required_artwork_categories", [])
          if category not in required and category not in {"character", "scene", "promotional"}:
              sys.exit(f"Rejected: category '{category}' is not requested for this post.")

          req = Request(url, headers={"User-Agent": "blogger_bot_img-artwork-import/1.0"})
          with urlopen(req, timeout=30) as response:
              data = response.read(20 * 1024 * 1024 + 1)
          if not data or len(data) > 20 * 1024 * 1024:
              sys.exit("Rejected: image is empty or exceeds 20 MiB.")

          target = Path(post) / "artwork" / category / filename
          target.parent.mkdir(parents=True, exist_ok=True)
          if target.exists():
              sys.exit(f"Rejected: destination already exists: {target}")

          temp = Path("/tmp/artwork-upload")
          temp.write_bytes(data)
          try:
              with Image.open(temp) as image:
                  image.verify()
              with Image.open(temp) as image:
                  fmt = (image.format or "").upper()
                  width, height = image.size
          except Exception as exc:
              sys.exit(f"Rejected: invalid image: {exc}")

          ext = Path(filename).suffix.lower()
          expected = {".jpg": "JPEG", ".jpeg": "JPEG", ".png": "PNG", ".webp": "WEBP"}[ext]
          if fmt != expected:
              sys.exit(f"Rejected: file extension expects {expected}, image is {fmt}.")
          if width < 320 or height < 180:
              sys.exit(f"Rejected: image is too small ({width}x{height}).")

          target.write_bytes(data)
          digest = hashlib.sha256(data).hexdigest()
          print(f"Validated {fmt} {width}x{height}; SHA-256 {digest}")
          print(f"Destination: {target}")
          PY

      - name: Commit artwork
        env:
          POST_FOLDER: ${{ inputs.post_folder }}
          CATEGORY: ${{ inputs.category }}
          FILENAME: ${{ inputs.filename }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$POST_FOLDER/artwork/$CATEGORY/$FILENAME"
          git commit -m "Add $CATEGORY artwork for $POST_FOLDER"
          git push
