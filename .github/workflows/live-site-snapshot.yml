name: Live Site Snapshot Check

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  snapshot-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium browser
        run: npx playwright install --with-deps chromium

      - name: Take live site snapshots
        run: npx playwright test --project=chromium --grep @live-snapshot

      - name: Upload snapshot artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-site-snapshots
          path: |
            playwright-report/
            test-results/
            snapshot-*.png
          retention-days: 7
